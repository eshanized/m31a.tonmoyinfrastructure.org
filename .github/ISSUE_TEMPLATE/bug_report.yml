name: Bug Report
description: Report an issue or broken element on the M31A website or docs
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue with the M31A website!
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The URL where the issue occurred (e.g., https://m31a.tonmoyinfrastructure.org/docs)
      placeholder: https://m31a.tonmoyinfrastructure.org/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
